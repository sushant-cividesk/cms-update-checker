services:
  real-drupal-db:
    image: mariadb:10.11
    container_name: real-drupal-db
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  real-drupal:
    build:
      context: ./local-dev/real-drupal
    container_name: real-drupal
    depends_on:
      real-drupal-db:
        condition: service_healthy
    environment:
      DRUPAL_DB_HOST: real-drupal-db
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupal
      COMPOSER_HOME: /tmp/composer
    ports:
      - "8081:80"

  real-wordpress-db:
    image: mariadb:10.11
    container_name: real-wordpress-db
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  real-wordpress:
    build:
      context: ./local-dev/real-wordpress
    container_name: real-wordpress
    depends_on:
      real-wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: real-wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    ports:
      - "8082:80"

  mailpit:
    image: axllent/mailpit:latest
    container_name: cms-update-checker-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
